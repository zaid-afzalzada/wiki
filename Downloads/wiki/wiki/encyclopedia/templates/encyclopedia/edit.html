{% extends "encyclopedia/layout.html" %}

{% block title %}
Edit {{ title }}
{% endblock %}

{% block body %}

```
<h1>Edit {{ title }}</h1>

<form method="post">
    {% csrf_token %}

    <div class="form-group">
        <label>Content</label>

        <textarea
            class="form-control"
            name="content"
            rows="15">{{ content }}</textarea>
    </div>

    <button class="btn btn-primary" type="submit">
        Save Changes
    </button>
</form>
```

{% endblock %}
