{% extends "encyclopedia/layout.html" %}

{% block title %}
    Search
{% endblock %}

{% block body %}

    <h1>Search results for: {{ query }}</h1>

    <ul>
        {% for entry in results %}
            <li>
                <a href="{% url 'entry' entry %}">
                    {{ entry }}
                </a>
            </li>
        {% empty %}
            <li>No results found.</li>
        {% endfor %}
    </ul>

{% endblock %}
