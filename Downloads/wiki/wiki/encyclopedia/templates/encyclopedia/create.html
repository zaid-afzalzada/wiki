{% extends "encyclopedia/layout.html" %}

{% block title %}
    Create New Page
{% endblock %}

{% block body %}

    <h1>Create New Page</h1>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>Title</label>
            <input
                class="form-control"
                type="text"
                name="title">
        </div>

        <div class="form-group">
            <label>Content</label>
            <textarea
                class="form-control"
                name="content"
                rows="10"></textarea>
        </div>

        <button class="btn btn-primary" type="submit">
            Save Page
        </button>
    </form>

{% endblock %}
