{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

```
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% block title %}{% endblock %}</title>

<link rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
      crossorigin="anonymous">

<link href="{% static 'encyclopedia/styles.css' %}" rel="stylesheet">
```

</head>

<body class="bg-light">

```
<div class="row no-gutters">

    <!-- ================= SIDEBAR ================= -->

    <div class="sidebar col-lg-3 col-md-4 col-sm-12 bg-dark text-white shadow">

        <div class="p-3 p-md-4 p-lg-5">

            <!-- Logo -->

            <h1 class="display-4 font-weight-bold mb-0">
                Wiki
            </h1>

            <p class="text-white-50 mb-4 mb-lg-5">
                The free encyclopedia
            </p>


            <!-- ================= SEARCH ================= -->

            <form
                action="{% url 'search' %}"
                method="get"
                class="mb-4 mb-lg-5">

                <input
                    class="form-control form-control-lg rounded-pill border-0 shadow px-4 mb-3"
                    type="text"
                    name="q"
                    placeholder="Search Encyclopedia">

                <button
                    type="submit"
                    class="btn btn-primary btn-lg btn-block rounded-pill shadow">

                    Search

                </button>

            </form>


            <!-- ================= NAVIGATION ================= -->

            <nav>

                <!-- Home -->

                <a
                    href="{% url 'index' %}"
                    class="btn btn-primary btn-block text-left rounded-pill px-4 py-2 mb-2 font-weight-bold">

                    Home

                </a>


                <!-- Create Page -->

                <a
                    href="{% url 'create' %}"
                    class="btn btn-outline-light btn-block text-left rounded-pill px-4 py-2 mb-2">

                    Create New Page

                </a>


                <!-- Random Page -->

                <a
                    href="{% url 'random' %}"
                    class="btn btn-outline-light btn-block text-left rounded-pill px-4 py-2 mb-2">

                    Random Page

                </a>

            </nav>


            {% block nav %}
            {% endblock %}

        </div>

    </div>


    <!-- ================= MAIN CONTENT ================= -->

    <div class="main col-lg-8 col-md-8 col-sm-12 p-3 p-md-4 p-lg-5">

        <div class="card border-0 shadow-lg rounded-lg">

            <div class="card-body p-3 p-md-4 p-lg-5">

                {% block body %}
                {% endblock %}

            </div>

        </div>

    </div>

</div>
```

</body>

</html>
